name: smoke

# Install / binary smoke: Ubuntu + Rocky 8 + package-contents (nfpm deb) +
# musl/static (Alpine build). macOS unit tests + binary smoke live in ci.yml
# (macos-unit-smoke; no macFUSE). Optional FUSE job on workflow_dispatch only
# (needs /dev/fuse + engine install).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_fuse:
        description: "Run optional FUSE integration test (installs fuse3; tries ratarmount-rs if available)"
        type: boolean
        default: false

jobs:
  ubuntu-binary:
    name: ubuntu-binary-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build (CGO=0)
        env:
          CGO_ENABLED: "0"
        run: make build
      - name: Binary smoke
        run: ./scripts/smoke-binary.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mount-wrapper-linux-amd64
          path: bin/mount-wrapper

  rocky8-binary:
    name: rocky8-binary-smoke
    runs-on: ubuntu-latest
    needs: ubuntu-binary
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: mount-wrapper-linux-amd64
          path: bin
      - name: Fix permissions
        run: chmod +x bin/mount-wrapper
      - name: Rocky 8 container smoke
        run: ./scripts/smoke-rocky8.sh

  # Deb content inventory via packaging/nfpm.yaml (default local/CI packaging path).
  # Lightweight: go install nfpm + dpkg-deb; no FUSE, no full goreleaser.
  # Pin nfpm to a release that builds with Go 1.25.x (latest may require 1.26+).
  package-contents:
    name: package-contents-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
      - name: Package contents smoke
        env:
          REQUIRE_TOOLS: "1"
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:${HOME}/go/bin:${PATH}"
          command -v nfpm
          command -v dpkg-deb
          ./scripts/smoke-package-contents.sh --build --require-tools
      - name: Go test package contents (same tools)
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:${HOME}/go/bin:${PATH}"
          go test ./internal/config/ -count=1 -run TestPackageContentsInventory -v

  # D7 extra path: static binary built in golang:*-alpine; smoke on Alpine + Rocky 8.
  # Does not replace default CGO_ENABLED=0 goreleaser releases.
  musl-static:
    name: musl-static-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static (Alpine / musl env)
        run: ./scripts/build-musl.sh
      - name: file / ldd checks (host)
        run: |
          set -euo pipefail
          BIN=bin/mount-wrapper-linux-amd64-musl
          file "$BIN"
          file "$BIN" | grep -qiE 'statically linked|static-pie'
          # ldd fails or reports non-dynamic for static binaries
          if ldd "$BIN" 2>&1 | tee /tmp/ldd.out; then
            grep -qiE 'not a dynamic|statically linked' /tmp/ldd.out
          fi
      - name: Binary smoke inside Alpine
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/bin/mount-wrapper-linux-amd64-musl:/usr/local/bin/mount-wrapper:ro" \
            -v "$PWD/scripts/smoke-binary.sh:/smoke-binary.sh:ro" \
            alpine:3.21 \
            sh -ec 'apk add --no-cache bash coreutils >/dev/null
              BIN=/usr/local/bin/mount-wrapper bash /smoke-binary.sh'
      - name: Binary smoke inside Rocky 8 (static on glibc)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/bin/mount-wrapper-linux-amd64-musl:/usr/local/bin/mount-wrapper:ro" \
            -v "$PWD/scripts/smoke-binary.sh:/smoke-binary.sh:ro" \
            rockylinux:8 \
            bash -lc 'BIN=/usr/local/bin/mount-wrapper bash /smoke-binary.sh'
      - name: Upload musl static binary
        uses: actions/upload-artifact@v4
        with:
          name: mount-wrapper-linux-amd64-musl
          path: bin/mount-wrapper-linux-amd64-musl

  # Optional: real FUSE. Not on push/PR by default (engine install + device).
  fuse-integration:
    name: fuse-integration (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_fuse }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install fuse3
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          # Allow fusermount for runner user when possible
          if [[ -e /dev/fuse ]]; then ls -la /dev/fuse; else echo "no /dev/fuse"; fi
      - name: Install ratarmount-rs (cargo) if possible
        continue-on-error: true
        run: |
          if command -v cargo >/dev/null 2>&1; then
            cargo install ratarmount-rs --locked 2>/dev/null || true
          else
            # Try prebuilt or skip — test will Skip if no engine
            echo "cargo not available; fuse test may skip without ratarmount-rs"
          fi
          command -v ratarmount-rs || command -v ratarmount || true
      - name: FUSE integration test
        run: |
          go test -tags=fuse ./internal/mounter/ -count=1 -run TestRealFUSEMountUnmount -v
        env:
          PATH: ${{ env.PATH }}:${{ runner.tool_cache }}
