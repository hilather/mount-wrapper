name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run optional Playwright SPA smoke (installs Chromium + deps)"
        type: boolean
        default: false

jobs:
  go:
    name: go-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod requires 1.25 (modernc.org/sqlite and toolchain).
          go-version: "1.25.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race (control / state / service / api / mounter)
        # Full-suite -race is slow; keep the concurrency-critical packages under race.
        run: go test -race ./internal/control/... ./internal/state/... ./internal/service/... ./internal/api/... ./internal/mounter/...
      - name: Build
        run: make build
      # Rocky 8 binary smoke: smoke.yml (ubuntu-built CGO=0 binary in rockylinux:8).
      # Real FUSE: optional smoke.yml workflow_dispatch run_fuse (not default).

  # macOS: unit tests + binary smoke only. No macFUSE on GitHub runners by default;
  # FUSE mount paths stay local/manual (docs/macos.md).
  macos:
    name: macos-unit-smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match go.mod / ubuntu go-test job (modernc.org/sqlite toolchain).
          go-version: "1.25.x"
      - name: Test
        # Package-by-package so failures land in the step summary + a public
        # commit comment (raw job logs may require auth). TMPDIR=/tmp shortens
        # Unix socket paths under macOS sun_path (~104 bytes).
        env:
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          fail=0
          : > /tmp/macos-fail.md
          {
            echo "## macOS go test"
            echo ""
            echo "TMPDIR=\`$TMPDIR\` GOOS=\`$(go env GOOS)\` GOARCH=\`$(go env GOARCH)\`"
            echo ""
          } | tee -a /tmp/macos-fail.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          while IFS= read -r pkg; do
            if ! go test -count=1 -timeout 120s "$pkg" >"/tmp/gotest-pkg.log" 2>&1; then
              fail=1
              {
                echo "### FAIL \`$pkg\`"
                echo '```'
                tail -n 100 "/tmp/gotest-pkg.log" || true
                echo '```'
                echo ""
              } | tee -a /tmp/macos-fail.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "FAIL $pkg" >&2
              cat "/tmp/gotest-pkg.log" >&2
            else
              echo "ok $pkg"
            fi
          done < <(go list ./...)
          exit "$fail"
      - name: Publish test failures (public commit comment)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Official gh may not be on PATH; use API via curl + GITHUB_TOKEN.
          body_file=/tmp/macos-fail.md
          if [[ ! -s "$body_file" ]]; then
            echo "macOS go test failed (no package log captured)" > "$body_file"
          fi
          # Truncate to stay under GitHub comment size limits.
          head -c 60000 "$body_file" > /tmp/macos-fail-trim.md
          python3 - <<'PY'
          import json, os, urllib.request
          body = open("/tmp/macos-fail-trim.md").read()
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "mount-wrapper-ci",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print("comment status", resp.status)
          PY
      - name: Build (CGO=0)
        env:
          CGO_ENABLED: "0"
        run: make build
      - name: Binary smoke (no macFUSE)
        env:
          TMPDIR: /tmp
        run: ./scripts/smoke-binary.sh

  web:
    name: web-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Embed SPA into internal/webui (embed.FS smoke)
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -a web/dist/. internal/webui/dist/
          go test ./internal/webui/...
      # Playwright is NOT run in this job (browser download is heavy).
      # Optional: Actions → Run workflow → enable "run_e2e", or locally:
      #   cd web && npm run test:e2e:install && RUN_E2E=1 npm run test:e2e

  # Optional Playwright SPA smoke (mocked /api/*; no daemon). Not on push/PR.
  web-e2e:
    name: web-e2e (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: SPA smoke (mocked API)
        run: RUN_E2E=1 npm run test:e2e
        env:
          CI: true
